services:
  db:
    image: pgvector/pgvector:pg17
    container_name: procuremind-db
    environment:
      POSTGRES_DB: procuremind
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d procuremind"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
